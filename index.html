<title>Merak Ormanı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>[hidden]{display:none!important}
/* Layout: phone-first game shell. Sticky top bar (energy, language), one stage per screen, fixed bottom tab bar (Orman / Üs). The concept tree grows upward from its root. */
:root{
  --bg:#EDF3F5; --surface:#F9FCFD; --surface2:#DCE9EE; --ink:#10303B; --ink2:#46636D; --line:#BCD2D9;
  --ice:#5FB0CE; --btn:#1D6A86; --on-btn:#FFFFFF; --fuel:#E8A02A; --on-fuel:#2A1B00;
  --good:#23704A; --bad:#B8472F; --r1:#2F7FA3; --r2:#4E9C86; --r3:#C57A5F; --sky1:#CFE6F0; --sky2:#EDF3F5;
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1B22; --surface:#12262F; --surface2:#1A3440; --ink:#E4F1F5; --ink2:#9DBAC4; --line:#2A4755;
    --ice:#7CC4DE; --btn:#7CC4DE; --on-btn:#06222C; --fuel:#F2B04A; --on-fuel:#2A1B00;
    --good:#5FCB8F; --bad:#F0866F; --r1:#5BB0D6; --r2:#74C2AA; --r3:#E0987E; --sky1:#12303C; --sky2:#0B1B22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1B22; --surface:#12262F; --surface2:#1A3440; --ink:#E4F1F5; --ink2:#9DBAC4; --line:#2A4755;
  --ice:#7CC4DE; --btn:#7CC4DE; --on-btn:#06222C; --fuel:#F2B04A; --on-fuel:#2A1B00;
  --good:#5FCB8F; --bad:#F0866F; --r1:#5BB0D6; --r2:#74C2AA; --r3:#E0987E; --sky1:#12303C; --sky2:#0B1B22;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--fuel);outline-offset:2px}
.wrap{width:100%;max-width:560px;margin-inline:auto;padding-inline:16px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding-block:8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.2px;margin-right:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.fuel{background:var(--fuel);color:var(--on-fuel)}
.lv i{display:inline-block;width:6px;height:12px;border-radius:2px;background:var(--line)}
.lv i.on{background:var(--btn)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 10px;font-weight:800;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}

/* stage */
.stage{padding-block:16px 108px;display:grid;gap:14px;align-content:start}
.kicker{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.q{font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1.18;margin:0;text-wrap:balance}
.muted{color:var(--ink2);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.small{font-size:13px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.back{justify-self:start;border:0;background:transparent;font-weight:800;color:var(--ink2);padding:4px 0}

/* buttons and options */
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:48px;font-weight:800;background:var(--btn);color:var(--on-btn)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;min-height:48px}
.opt.picked{border-color:var(--btn);background:var(--surface2)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt[disabled]{cursor:default}

/* stepper */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.steps span{font-size:11px;font-weight:800;color:var(--ink2);border-top:5px solid var(--line);padding-top:4px;text-align:center;white-space:nowrap}
.steps span.done{border-top-color:var(--ice)}
.steps span.on{border-top-color:var(--btn);color:var(--ink)}

/* lab */
.lab{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:10px}
.cv,.svgfig{width:100%;display:block;border-radius:12px;background:var(--surface2)}
.svgfig{height:auto}
.lab input[type=range]{width:100%;min-height:36px;accent-color:var(--btn)}
.rowl{display:grid;gap:2px}
.rowl label{font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tag{font-weight:800;font-size:13px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;min-height:40px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo div{font-size:13px;font-weight:700;background:var(--surface2);border-radius:12px;padding:8px 10px}
.svgfig text{fill:var(--ink);font-family:var(--f-body);font-weight:800}
.svgfig .dim{fill:var(--ink2);font-weight:700}

/* layers */
.layer{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;animation:rise .35s ease-out}
.layer h3{margin:0 0 4px;font-family:var(--f-display);font-size:18px;font-weight:700}
.layer p{margin:0}
.lchip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--surface2);padding:2px 8px;border-radius:999px;margin-bottom:6px}
.why{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:15px}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* forest */
.tree{width:100%;height:auto;display:block}
.edge{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}
.edge.on{stroke:var(--ice)}
.edge.dash{stroke-dasharray:1 9}
.nd{cursor:pointer;color:var(--btn)}
.nd circle.c{fill:var(--surface);stroke:var(--btn);stroke-width:3}
.nd.done{color:var(--on-btn)}
.nd.done circle.c,.nd.root circle.c{fill:var(--btn)}
.nd.root{color:var(--on-btn)}
.nd.soon{color:var(--ink2)}
.nd.soon circle.c{fill:var(--surface2);stroke:var(--ink2);stroke-width:2.5;stroke-dasharray:5 5}
.nd.locked{color:var(--ink2);opacity:.42;cursor:default}
.nd.locked circle.c{stroke:var(--line)}
.nd text{fill:var(--ink);font:800 12.5px var(--f-body);text-anchor:middle;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.nd .ring{fill:none;stroke:var(--fuel);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.nd .badge{fill:var(--fuel)}
.tq{fill:var(--ink2);font:800 15px var(--f-body);text-anchor:middle}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.4);opacity:0}}

/* base */
.scene{width:100%;height:auto;display:block;border-radius:18px;border:1px solid var(--line)}
.item.ghost *{fill:none!important;stroke:var(--ink2)!important;stroke-dasharray:3 3;opacity:.5}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.li b{display:block}
.li .dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.li.on .dot{background:var(--good)}
.bar2{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--fuel)}

/* world map */
.area{display:grid;gap:10px}
.ah{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fcard{display:grid;gap:2px;justify-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:84px;color:var(--ink);font:inherit}
button.fcard{cursor:pointer;border:2px solid var(--btn);align-content:start}
.fcard svg{color:var(--btn)}
.fcard b{font-size:14.5px;line-height:1.25}
.fcard.soon{background:transparent;border:1px dashed var(--line);color:var(--ink2);min-height:0;padding:8px 12px}
.fcard.soon b{font-weight:700;font-size:13.5px}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rw{display:grid;justify-items:center;gap:2px;padding:8px 2px;border-radius:14px;background:var(--surface2);border:2px solid transparent;color:var(--ink);font:inherit;cursor:pointer;min-height:76px;align-content:center}
.rw .re{font-size:28px;line-height:1}.rw .rn{font-size:11.5px;font-weight:700;text-align:center;line-height:1.15}
.rw.lock{opacity:.55}.rw.on{border-color:var(--btn)}
@media(min-width:520px){.rgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--surface2);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin-inline:auto;padding-inline:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-block:8px}
.tab{border:0;background:transparent;border-radius:14px;padding:8px;font-weight:800;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.tab[aria-current="page"]{background:var(--surface2);color:var(--ink)}

/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(8,20,26,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;max-width:90vw;text-align:center}

@media (prefers-reduced-motion:reduce){
  .nd .ring{animation:none;opacity:.7}
  .layer{animation:none}
  *{transition:none!important}
}
.ah{justify-content:flex-start;gap:.6rem}.ah .small{margin-left:auto}.aic{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:1.4rem;line-height:1;flex:none}
</style>
<header class="topbar">
  <div class="wrap bar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--btn)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><path d="M12 8l3.2 1.85v3.7L12 15.4l-3.2-1.85v-3.7z" fill="var(--fuel)" stroke="var(--fuel)"/></svg>
      <span>Merak Ormanı</span>
    </div>
    <span class="pill fuel" id="energy" title="Merak"></span>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="tr" aria-pressed="true">TR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>
<main class="wrap stage" id="stage"></main>
<nav class="tabs" aria-label="Menu">
  <div class="in">
    <button type="button" class="tab" id="tab-forest" data-view="forest"></button>
    <button type="button" class="tab" id="tab-base" data-view="base"></button>
  </div>
</nav>
<div class="sheet" id="sheet" hidden>
  <div class="box" role="dialog" aria-modal="true">
    <h2 class="q" id="sheet-t"></h2>
    <p class="muted" id="sheet-p"></p>
    <button type="button" class="btn" id="sheet-x"></button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

function checkRewards(){
  const k=rwOpen().length;
  if(k>S.rw){
    const fresh=RW.slice(S.rw,k);S.rw=k;save();
    const last=fresh[fresh.length-1];
    setTimeout(()=>{ $('#sheet-t').textContent='🎉 '+last.e+' '+L(last.n);
      $('#sheet-p').textContent=(S.lang==='tr'?'Yeni ödül kazandın! Üs sekmesindeki Ödül Rafı\'nda bulabilirsin.':'You won a new reward! Find it on the Reward Shelf in the Base tab.')+(fresh.length>1?(S.lang==='tr'?' Ayrıca: ':' Also: ')+fresh.slice(0,-1).map(r=>r.e+' '+L(r.n)).join(', '):'');
      $('#sheet-x').textContent=T('close');$('#sheet').hidden=false;$('#sheet-x').focus();},700);
  }
}
const rwBar=()=>{const nx=rwNext(),prev=rwOpen().slice(-1)[0],a=prev?prev.p:0;
  if(!nx)return `<p class="muted">${S.lang==='tr'?'Tüm ödülleri topladın! Harikasın.':'You collected every reward! Amazing.'}</p>`;
  const pct=Math.round((S.energy-a)/(nx.p-a)*100);
  return `<div class="small">${S.lang==='tr'?'Sıradaki ödül':'Next reward'}: <b>${nx.e} ${esc(L(nx.n))}</b> · ${nf(nx.p-S.energy)} ${T('gainTxt')}</div><div class="bar2" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>`;};
const rwShelf=()=>{const got=rwOpen().length,w=rwWear();
  return `<div class="card" style="display:grid;gap:10px"><b>${S.lang==='tr'?'Ödül Rafı':'Reward Shelf'} (${got}/${RW.length})</b>${rwBar()}
   <div class="rgrid">${RW.map((r,i)=>{const ok=S.energy>=r.p;return `<button type="button" class="rw${ok?'':' lock'}${w&&w.p===r.p?' on':''}" data-act="${ok?'wear':'rwlock'}" data-i="${i}" aria-label="${esc(L(r.n))}"><span class="re">${ok?r.e:'🔒'}</span><span class="rn">${ok?esc(L(r.n)):nf(r.p)}</span></button>`;}).join('')}</div>
   <p class="small">${S.lang==='tr'?'Kazandığın ödüle dokun: rozet olarak takarsın.':'Tap a reward you won to wear it as your badge.'}</p></div>`;};

LABS.freezeLab=function(host,touch){
  host.innerHTML=`<div class="lab"><canvas class="cv" role="img" aria-label="${esc(S.lang==='tr'?'Su molekülleri: sıcaklığa göre hareket eder ya da kafes kurar':'Water molecules: they move around or lock into a lattice depending on temperature')}"></canvas>
  <div class="readout"><span class="big" data-t></span><span class="tag" data-s></span></div>
  <input type="range" min="-20" max="20" step="1" value="8" data-r aria-label="${esc(T('temp'))}"></div>`;
  const cv=$('canvas',host),ctx=cv.getContext('2d'),rng=$('[data-r]',host),tv=$('[data-t]',host),st=$('[data-s]',host);
  let W=300,H=230,P=[],f=0,raf=0,seeded=false,sp=50;
  function layout(){
    const cols=6,rows=5,dx=Math.min(54,(W-60)/(cols+.5)),dy=(H-70)/(rows-1),x0=(W-(cols-1)*dx-dx/2)/2;
    sp=dx;
    if(!P.length){for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)P.push({r,c,x:0,y:0,vx:0,vy:0,a:0,hx:0,hy:0});}
    P.forEach(p=>{p.hx=x0+p.c*dx+(p.r%2?dx/2:0);p.hy=35+p.r*dy;
      if(!seeded){p.x=Math.random()*W;p.y=Math.random()*H;const a=Math.random()*6.28;p.vx=Math.cos(a);p.vy=Math.sin(a);}});
    seeded=true;
  }
  function size(){
    W=Math.max(220,host.clientWidth-24);const d=window.devicePixelRatio||1;
    cv.width=W*d;cv.height=H*d;cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);layout();
  }
  function step(){
    const Tn=+rng.value,fr=Tn<=0;f+=((fr?1:0)-f)*.05;
    const s=.9+Math.max(0,Tn)*.09,j=f*(.25+(Tn+20)/40*.9);
    P.forEach(p=>{
      if(!fr){p.vx+=(Math.random()-.5)*.3;p.vy+=(Math.random()-.5)*.3;const m=Math.hypot(p.vx,p.vy)||1;p.vx*=s/m;p.vy*=s/m;p.a+=(Math.random()-.5)*.3*(1-f);}
      p.x+=p.vx*(1-f)+(p.hx-p.x)*.06*f+(Math.random()-.5)*j;
      p.y+=p.vy*(1-f)+(p.hy-p.y)*.06*f+(Math.random()-.5)*j;
      if(p.x<12||p.x>W-12){p.vx*=-1;p.x=Math.max(12,Math.min(W-12,p.x));}
      if(p.y<12||p.y>H-12){p.vy*=-1;p.y=Math.max(12,Math.min(H-12,p.y));}
      if(fr){p.a=((p.a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;p.a+=(0-p.a)*.1;}
    });
    tv.textContent=nf(Tn)+' °C';
    st.textContent=fr?T('ice'):T('liquid');
  }
  function draw(){
    const cs=getComputedStyle(cv),cO=cs.getPropertyValue('--btn').trim(),cH=cs.getPropertyValue('--ice').trim(),cB=cs.getPropertyValue('--ink2').trim();
    ctx.clearRect(0,0,W,H);
    if(f>.08){
      ctx.save();ctx.strokeStyle=cB;ctx.globalAlpha=f*.55;ctx.setLineDash([3,4]);ctx.lineWidth=1.5;
      for(let i=0;i<P.length;i++)for(let k=i+1;k<P.length;k++){const a=P[i],b=P[k];if(Math.hypot(a.x-b.x,a.y-b.y)<sp*1.15){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
      ctx.restore();
    }
    P.forEach(p=>{
      ctx.fillStyle=cH;
      [-1,1].forEach(sg=>{const ang=p.a+sg*0.91+Math.PI/2;ctx.beginPath();ctx.arc(p.x+Math.cos(ang)*12,p.y+Math.sin(ang)*12,5,0,6.283);ctx.fill();});
      ctx.fillStyle=cO;ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.283);ctx.fill();
    });
  }
  function loop(){if(!host.isConnected)return;step();draw();raf=requestAnimationFrame(loop);}
  const onR=()=>{if(host.isConnected)size();};
  window.addEventListener('resize',onR);
  rng.addEventListener('input',touch);
  size();loop();
  return()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',onR);};
};

LABS.densityLab=function(host,touch){
  const RHO=0.917,SIDE=56;
  const LQ=[
   {k:'water',n:{tr:'Su',en:'Water'},r:1.0,o:.5,c:'--ice'},
   {k:'sea',n:{tr:'Deniz suyu',en:'Sea water'},r:1.025,o:.75,c:'--ice'},

  host.innerHTML=`<div class="lab"><svg class="svgfig" viewBox="0 0 300 250" role="img" aria-label="${esc(S.lang==='tr'?'Bardakta buz küpü':'Ice cube in a glass')}">
   <rect data-w x="72" y="100" width="156" height="129" fill="var(--ice)" opacity=".5"/>
   <g data-c style="transition:transform 1.1s cubic-bezier(.3,1.35,.5,1);transform:translate(122px,4px)">
    <rect width="${SIDE}" height="${SIDE}" rx="6" fill="var(--surface)" stroke="var(--btn)" stroke-width="3"/>
    <path d="M14 18h28M14 28h28M14 38h28" stroke="var(--ice)" stroke-width="3" stroke-linecap="round"/>
   </g>
   <path d="M70 30V225a8 8 0 0 0 8 8H222a8 8 0 0 0 8-8V30" fill="none" stroke="var(--ink2)" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <div class="chips" role="group">${LQ.map((q,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="false">${esc(L(q.n))}</button>`).join('')}</div>
  <div class="readout"><span class="big" data-p></span><span class="tag" data-i2></span></div></div>`;
  const cube=$('[data-c]',host),water=$('[data-w]',host);
  function pick(i){
    const q=LQ[i],fr=RHO/q.r;
    $$('.chip',host).forEach((b,k)=>b.setAttribute('aria-pressed',k===i?'true':'false'));
    water.setAttribute('fill','var('+q.c+')');water.setAttribute('opacity',q.o);
    const y=fr<1?100-SIDE*(1-fr):229-SIDE-2;
    cube.style.transform=`translate(122px,${y}px)`;
    $('[data-p]',host).textContent=fr<1?'%'+nf(fr*100):(S.lang==='tr'?'Batar':'Sinks');
    $('[data-i2]',host).textContent=(S.lang==='tr'?'Buz ':'Ice ')+nf(RHO,2)+' · '+L(q.n)+' '+nf(q.r,2)+' g/cm³';
  }
  $$('.chip',host).forEach(b=>b.addEventListener('click',()=>{pick(+b.dataset.i);touch();}));
  pick(0);
  cube.style.transform='translate(122px,4px)';
  const h=setTimeout(()=>pick(0),120);
  return()=>clearTimeout(h);
};

LABS.seaLab=function(host,touch){
  const SRC=[{id:'gre',n:{tr:'Grönland',en:'Greenland'},m:7,v:100},{id:'ant',n:{tr:'Antarktika',en:'Antarctica'},m:58,v:0},{id:'mtn',n:{tr:'Dağ buzulları',en:'Mountain glaciers'},m:.4,v:100}];
  const LM=[[1.5,{tr:'Maldivler (ort. yükseklik)',en:'Maldives (avg. height)'}],[10,{tr:'3 katlı bina',en:'3-storey building'}],[30,{tr:'10 katlı bina',en:'10-storey building'}],[67,{tr:'Galata Kulesi boyu',en:'Galata Tower height'}]];
  const SC=2.6,BASE=230,Yw=m=>BASE-m*SC;
  host.innerHTML=`<div class="lab"><svg class="svgfig" viewBox="0 0 320 250" role="img" aria-label="${esc(S.lang==='tr'?'Yükselen deniz seviyesi ve cetvel':'Rising sea level and a ruler')}">
   <polygon points="120,230 150,200 190,160 230,118 270,82 320,50 320,250 120,250" fill="var(--line)"/>
   <rect data-w x="0" y="230" width="320" height="20" fill="var(--ice)" opacity=".7"/>
   <g data-lm>${LM.map((l,i)=>`<g data-k="${i}"><path d="M0 ${Yw(l[0])}H320" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="3 4"/><text x="6" y="${Yw(l[0])-4}" font-size="10.5" class="dim"></text></g>`).join('')}</g>
  </svg>
  <div class="readout"><span class="big" data-tot></span><span class="tag">${S.lang==='tr'?'deniz seviyesi':'sea level'}</span></div>
  ${SRC.map((s,i)=>`<div class="rowl"><label for="sea-${i}"><span>${esc(L(s.n))} (≈${nf(s.m,s.m<1?1:0)} m)</span><span data-v="${i}"></span></label><input id="sea-${i}" type="range" min="0" max="100" step="1" value="${s.v}"></div>`).join('')}
  <p class="small">${S.lang==='tr'?'Gerçekte bu kadar erime yüzyıllar sürer. Bugün deniz seviyesi yılda yaklaşık 4–5 mm yükseliyor.':'In reality this much melting takes centuries. Today sea level rises about 4–5 mm a year.'}</p></div>`;
  const water=$('[data-w]',host);
  function upd(){
    let tot=0;
    SRC.forEach((s,i)=>{const v=+$('#sea-'+i,host).value;tot+=s.m*v/100;$('[data-v="'+i+'"]',host).textContent='%'+nf(v);});
    const y=Yw(tot);water.setAttribute('y',y);water.setAttribute('height',250-y);
    $('[data-tot]',host).textContent='+'+nf(tot,1)+' m';
    $$('[data-k]',host).forEach(g=>{const l=LM[+g.dataset.k],hit=tot>=l[0];const t=$('text',g);
      t.textContent=(hit?'✓ ':'')+L(l[1])+' · '+nf(l[0],l[0]<2?1:0)+' m';t.style.fill=hit?'var(--ink)':'';t.classList.toggle('dim',!hit);});
  }
  SRC.forEach((s,i)=>$('#sea-'+i,host).addEventListener('input',()=>{upd();touch();}));
  upd();
  return()=>{};
};

/* ---------- generic experiments: sliders or chips drive one small picture ---------- */
const clamp01=v=>Math.max(0,Math.min(1,v));
const interp=(a,v)=>{if(v<=a[0][0])return a[0][1];for(let i=1;i<a.length;i++){if(v<=a[i][0]){const t=(v-a[i-1][0])/(a[i][0]-a[i-1][0]);return a[i-1][1]+t*(a[i][1]-a[i-1][1]);}}return a[a.length-1][1];};
const CAB=[[0,350],[3,350],[5,300],[7,265],[8,225],[10,190],[12,140],[14,60]];
const phHue=(v,m)=>m==='cab'?interp(CAB,v):(v<7?v/7*120:120+(v-7)/7*160);
const VIZ={
 bar:(r,sp)=>{const p=clamp01(r.p);return `<rect x="10" y="50" width="280" height="30" rx="15" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/><rect x="12" y="52" width="${Math.max(0,276*p).toFixed(1)}" height="26" rx="13" fill="var(--btn)"/>${(sp.ticks||[]).map(t=>`<path d="M${12+276*t.at} 84v8" stroke="var(--ink2)" stroke-width="2"/><text x="${12+276*t.at}" y="108" font-size="11" text-anchor="middle" class="dim">${esc(L(t.l))}</text>`).join('')}`;},
 bar2:r=>[[r.p,'var(--r1)',r.la],[r.q,'var(--r3)',r.lb]].map((b,i)=>`<rect x="10" y="${28+i*50}" width="280" height="30" rx="15" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/><rect x="12" y="${30+i*50}" width="${Math.max(0,276*clamp01(b[0])).toFixed(1)}" height="26" rx="13" fill="${b[1]}"/><text x="24" y="${49+i*50}" font-size="13" style="fill:var(--on-btn)">${esc(b[2]||'')}</text>`).join(''),
 wave:r=>{const a=8+clamp01(r.p)*55,c=1+(r.q==null?.3:r.q)*7;let d='';for(let i=0;i<=120;i++){d+=(i?'L':'M')+(10+i*280/120).toFixed(1)+' '+(75+a*Math.sin(i/120*c*6.2832)).toFixed(1);}return `<path d="M10 75H290" stroke="var(--line)" stroke-dasharray="4 5"/><path d="${d}" fill="none" stroke="var(--btn)" stroke-width="4" stroke-linecap="round"/>`;},
 pie:r=>{const d=Math.max(1,Math.round(r.q)),n=Math.max(0,Math.min(d,Math.round(r.p))),cx=150,cy=75,R=64;let s='';for(let i=0;i<d;i++){const a0=-Math.PI/2+i/d*6.2832,a1=-Math.PI/2+(i+1)/d*6.2832,f=i<n?'var(--btn)':'var(--surface)';
  s+=d===1?`<circle cx="${cx}" cy="${cy}" r="${R}" fill="${f}" stroke="var(--ink2)" stroke-width="2"/>`:`<path d="M${cx} ${cy}L${(cx+R*Math.cos(a0)).toFixed(1)} ${(cy+R*Math.sin(a0)).toFixed(1)}A${R} ${R} 0 0 1 ${(cx+R*Math.cos(a1)).toFixed(1)} ${(cy+R*Math.sin(a1)).toFixed(1)}Z" fill="${f}" stroke="var(--ink2)" stroke-width="2" stroke-linejoin="round"/>`;}return s;},
 dots:r=>{const N=40,k=Math.round(clamp01(r.p)*N);let s='';for(let i=0;i<N;i++){s+=`<circle cx="${(24+(i%10)*28)}" cy="${(24+Math.floor(i/10)*34)}" r="10" fill="${i<k?'var(--r2)':'var(--surface)'}" stroke="var(--line)" stroke-width="2"/>`;}return s;},
 spectrum:r=>{const p=clamp01(r.p),x=12+276*p;return `<defs><linearGradient id="spg"><stop offset="0" stop-color="hsl(270 90% 55%)"/><stop offset=".25" stop-color="hsl(220 90% 55%)"/><stop offset=".5" stop-color="hsl(120 70% 45%)"/><stop offset=".75" stop-color="hsl(50 95% 50%)"/><stop offset="1" stop-color="hsl(0 85% 50%)"/></linearGradient></defs><circle cx="150" cy="32" r="22" fill="hsl(${(270-270*p).toFixed(0)} 85% 52%)" stroke="var(--ink2)" stroke-width="3"/><path d="M${x} 78l-8-13h16z" fill="var(--ink)"/><rect x="12" y="82" width="276" height="28" rx="8" fill="url(#spg)"/><text x="12" y="128" font-size="11" class="dim">380 nm</text><text x="288" y="128" font-size="11" text-anchor="end" class="dim">700 nm</text>`;},
 ph:(r,sp)=>{const p=clamp01(r.p),pH=p*14,h=phHue(pH,sp.map);return `<defs><linearGradient id="phg">${[0,2,4,6,7,8,10,12,14].map(v=>`<stop offset="${v/14}" stop-color="hsl(${phHue(v,sp.map).toFixed(0)} 80% 50%)"/>`).join('')}</linearGradient></defs><path d="M130 4h40v26l26 40a7 7 0 0 1-6 11H110a7 7 0 0 1-6-11l26-40z" fill="hsl(${h.toFixed(0)} 80% 50%)" fill-opacity=".85" stroke="var(--ink2)" stroke-width="3" stroke-linejoin="round"/><path d="M${12+276*p} 94l-7-12h14z" fill="var(--ink)"/><rect x="12" y="98" width="276" height="22" rx="8" fill="url(#phg)"/><text x="12" y="138" font-size="11" class="dim">pH 0</text><text x="288" y="138" font-size="11" text-anchor="end" class="dim">pH 14</text>`;},
 tilt:r=>{const a=Math.max(-1,Math.min(1,r.p))*12;const w=(x,s,c)=>`<rect x="${(x-s/2).toFixed(1)}" y="${106-s}" width="${s}" height="${s}" rx="3" fill="${c}" stroke="var(--ink2)" stroke-width="2"/>`;return `<path d="M150 116L132 140h36z" fill="var(--ink2)"/><g transform="rotate(${a.toFixed(1)} 150 111)"><rect x="20" y="106" width="260" height="10" rx="5" fill="var(--btn)"/>${w(r.lx,r.ls,'var(--r3)')}${w(r.rx,r.rs,'var(--r1)')}</g>`;},
 mirror:r=>{const t=clamp01(r.p)*80*Math.PI/180,Ln=88,cx=150,cy=108,dx=Ln*Math.sin(t),dy=Ln*Math.cos(t);return `<path d="M${cx} ${cy}V16" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 5"/><path d="M${(cx-dx).toFixed(1)} ${(cy-dy).toFixed(1)}L${cx} ${cy}L${(cx+dx).toFixed(1)} ${(cy-dy).toFixed(1)}" fill="none" stroke="var(--fuel)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="108" width="240" height="10" rx="3" fill="var(--ink2)"/>`;},
 plates:r=>{const m=Math.round(r.q),ar=(x1,y1,x2,y2)=>{const a=Math.atan2(y2-y1,x2-x1),h=7;return `<path d="M${x1} ${y1}L${x2} ${y2}M${x2} ${y2}l${(-h*Math.cos(a-.5)).toFixed(1)} ${(-h*Math.sin(a-.5)).toFixed(1)}M${x2} ${y2}l${(-h*Math.cos(a+.5)).toFixed(1)} ${(-h*Math.sin(a+.5)).toFixed(1)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" fill="none"/>`;};
  const arrows=m===0?ar(100,40,60,40)+ar(200,40,240,40):m===1?ar(60,40,100,40)+ar(240,40,200,40):ar(90,62,90,22)+ar(210,22,210,62);
  return `<rect x="150" y="96" width="0" height="0"/><rect x="10" y="100" width="280" height="40" fill="var(--fuel)" opacity=".35"/><rect x="${m===0?10:20}" y="70" width="${m===0?125:120}" height="34" rx="4" fill="var(--r3)"/><rect x="${m===0?165:160}" y="70" width="${m===0?125:120}" height="34" rx="4" fill="var(--r1)"/>${arrows}`;}
};
function GEN(sp,host,touch){
  const sl=sp.sliders||[],op=sp.opts||[],vals=sl.map(s=>s.val);let sel=0;
  host.innerHTML=`<div class="lab"><svg class="svgfig" viewBox="0 0 300 150" role="img" aria-label="${esc(L(sp.alt||B('Şema','Diagram')))}"></svg>
   <div class="readout"><span class="big" data-n></span><span class="tag" data-g></span></div>
   <p class="muted" data-t style="min-height:4.8em"></p>
   ${sl.map((s,i)=>`<div class="rowl"><label for="gs-${i}"><span>${esc(L(s.lab))}</span><span data-v="${i}"></span></label><input id="gs-${i}" type="range" min="${s.min}" max="${s.max}" step="${s.step||1}" value="${s.val}"></div>`).join('')}
   ${op.length?`<div class="chips" role="group">${op.map((o,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="false">${esc(L(o.n))}</button>`).join('')}</div>`:''}</div>`;
  const svg=$('svg',host);
  function upd(){
    const r=op.length?op[sel]:sp.f(vals);
    svg.innerHTML=VIZ[sp.viz](r,sp);
    $('[data-n]',host).textContent=r.num==null?'':(typeof r.num==='string'?r.num:L(r.num));
    $('[data-g]',host).textContent=r.tag?L(r.tag):'';
    $('[data-t]',host).textContent=L(r.t);
    sl.forEach((s,i)=>{$('[data-v="'+i+'"]',host).textContent=nf(vals[i],s.dec||0)+(s.unit?' '+L(s.unit):'');});
    $$('.chip',host).forEach((b,k)=>b.setAttribute('aria-pressed',k===sel?'true':'false'));
  }
  sl.forEach((s,i)=>$('#gs-'+i,host).addEventListener('input',e=>{vals[i]=+e.target.value;upd();touch();}));
  $$('.chip',host).forEach(b=>b.addEventListener('click',()=>{sel=+b.dataset.i;upd();touch();}));
  upd();return()=>{};
}

 {key:'magnitude',lab:B('Büyüklük','Magnitude'),icon:'quake',item:B('Sismograf Evi','Seismograph House'),

 {key:'volcano',lab:B('Volkan','Volcano'),icon:'volcano',item:B('Yanardağ Gözlemevi','Volcano Observatory'),

 {key:'mass',lab:B('Kütle korunumu','Mass'),icon:'scale',item:B('Terazi Kulesi','Balance Tower'),

 {key:'layers',lab:B('Katmanlar','Strata'),icon:'mountain',item:B('Jeoloji Kulesi','Geology Tower'),

 {key:'fossil',lab:B('Fosiller','Fossils'),icon:'mountain',item:B('Fosil Müzesi','Fossil Museum'),

   ['Nasıl oluşur?','How does one form?','Canlı hızla çökelti altında gömülür; yumuşak kısımlar bozulur, sert kısımlar mineralleşir ya da kalıp bırakır.','The organism is buried quickly in sediment; soft parts decay, hard parts mineralise or leave a mould.'],
   ['Fosiller bize ne anlatır?','What do fossils tell us?','Canlıların nasıl değiştiğini, eski iklimleri ve tabakaların yaşını. Aynı fosiller farklı yerlerdeki kayaları eşleştirir.','How life changed, ancient climates and layer ages. The same fossils help match rocks in different places.']]),
  ch:CH([

   ['Fosilleşme için en iyi koşul?','Best condition for fossilising:','Hızlı gömülme|Açıkta kalma|Güneş','Quick burial|Lying exposed|Sunshine',0,'Çürümeden korur.','It prevents decay.']])}

   ['Vakum süpürgesi değil','Not a cosmic vacuum cleaner','Uzaktan bakınca kara delik de başka bir kütle gibi çeker; Güneş yerine aynı kütlede bir kara delik olsa Dünya yine aynı yörüngede dönerdi (ama karanlıkta).','From far away a black hole pulls like any mass; swap the Sun for one of equal mass and Earth would keep its orbit (in the dark).']]),
  ch:CH([
   ['Olay ufku nedir?','The event horizon is:','Dönüşü olmayan sınır|Bir yıldız|Bir gezegen','The point of no return|A star|A planet',0,'Işık bile çıkamaz.','Not even light escapes.'],
   ['Kara delikten ne çıkamaz?','What can\'t escape?','Işık bile|Sadece ses|Hiçbir şey çıkar','Even light|Only sound|Everything escapes',0,'Kaçış hızı > ışık.','Escape speed > light.'],
   ['İlk görüntü ne zaman?','First image of one:','2019|1919|1819','2019|1919|1819',0,'Olay Ufku Teleskobu.','Event Horizon Telescope.']])}
]});

/* ===== shuffle answer positions (content authored with correct answer first) ===== */
(function(){
  function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
  function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function shuf(q,key){
    if(!q||!q.o||!q.o.tr||q.o.tr.length<2||q.o.en.length!==q.o.tr.length||typeof q.a!=='number')return;
    const n=q.o.tr.length,r=rng(hash(key)),p=[...Array(n).keys()];
    for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]];}
    q.o={tr:p.map(i=>q.o.tr[i]),en:p.map(i=>q.o.en[i])};q.a=p.indexOf(q.a);
  }
  Object.values(NODES).forEach(n=>{
    if(n._sh)return;n._sh=1;
    shuf(n,n.id+':g');
    if(Array.isArray(n.ch))n.ch.forEach((c,i)=>shuf(c,n.id+':c'+i));
  });
})();

/* ---------- app: world, forests, node flow, base ---------- */
const NODE_LIST=Object.values(NODES),PLAY=NODE_LIST.filter(n=>n.play);
let view='world',curF=null,run=null,labStop=null;
const stage=$('#stage');
const FCOL=['--r1','--r2','--r3','--fuel'];

const levelPill=()=>`<span class="pill lv" title="${esc(T('adapt'))}">${T('level')} ${[1,2,3].map(i=>`<i class="${i<=tier()?'on':''}"></i>`).join('')} ${esc(T('levels')[tier()-1])}</span>`;
const isTop=n=>!!(NODES[n.parent]&&NODES[n.parent].root);
const status=n=>{
  if(n.root)return 'root';
  if(S.done[n.id])return 'done';
  if(!(isTop(n)||S.done[n.parent]))return 'locked';
  return n.play?'open':'soon';
};
const prog=f=>{const ps=PLAY.filter(n=>n.fid===f);return[ps.filter(n=>S.done[n.id]).length,ps.length];};
const smallIcon=k=>`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||IC.q}</svg>`;

function renderTop(){
  const e=$('#energy');
  e.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L5 13h6l-1 9 8-12h-6z" fill="currentColor"/></svg>${nf(S.energy)}${rwWear()?' '+rwWear().e:''}`;
  e.title=T('energy');e.setAttribute('aria-label',T('energy')+': '+S.energy);
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang?'true':'false'));
}
function renderTabs(){
  const globe='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.5 3.5 3.5 14.5 0 18M12 3c-3.5 3.5-3.5 14.5 0 18"/></svg>';
  const houseI='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21l1.5-12h3L15 21zM10 9V6l2-2 2 2v3M4 21h16"/></svg>';
  $('#tab-forest').innerHTML=globe+`<span>${T('tabWorld')}</span>`;
  $('#tab-base').innerHTML=houseI+`<span>${T('tabBase')}</span>`;
  $('#tab-forest').setAttribute('aria-current',view==='base'?'false':'page');
  $('#tab-base').setAttribute('aria-current',view==='base'?'page':'false');
}
function setView(v){
  if(v!=='node')run=null;
  view=v;render();window.scrollTo(0,0);
}
function render(){
  if(labStop){labStop();labStop=null;}
  renderTop();renderTabs();
  if(view==='world')world();else if(view==='forest')forest();else if(view==='base')base();else nodeView();
}

/* world map */
function world(){
  const live=Object.values(FORESTS);
  const total=live.length+AREAS.reduce((s,a)=>s+a.plan.length,0);
  stage.innerHTML=`
   <div class="meta"><span class="pill">${live.length}/${total} ${T('forests')}</span>${levelPill()}</div>
   ${AREAS.map(a=>{
     const mine=live.filter(f=>f.area===a.id);
     return `<section class="area"><h2 class="ah"><span class="aic" aria-hidden="true">${a.ic||""}</span><span class="atx">${esc(L(a.lab))}</span><span class="small">${mine.length}/${mine.length+a.plan.length}</span></h2><div class="fgrid">
      ${mine.map(f=>{const p=prog(f.id);return `<button type="button" class="fcard" data-f="${f.id}">${smallIcon(f.icon)}<b>${esc(L(f.lab))}</b><span class="small">${p[0]}/${p[1]}</span></button>`;}).join('')}
      ${a.plan.map(s=>{const p=s.split('=');return `<div class="fcard soon"><b>${esc(S.lang==='tr'?p[0]:p[1])}</b><span class="small">${T('soonTag')}</span></div>`;}).join('')}
     </div></section>`;}).join('')}`;
}

/* one forest (concept tree) */
function forest(){
  const F=FORESTS[curF],list=NODE_LIST.filter(n=>n.fid===curF),[d,t]=prog(curF);
  let edges='',nodes='';
  list.forEach(n=>{
    if(!n.parent)return;
    const p=NODES[n.parent],on=isTop(n)||S.done[n.parent];
    const sy=p.pos[1]-p.r,ey=n.pos[1]+n.r,my=(sy+ey)/2;
    edges+=`<path class="edge${on?' on':''}" d="M${p.pos[0]} ${sy}C${p.pos[0]} ${my},${n.pos[0]} ${my},${n.pos[0]} ${ey}"/>`;
  });
  F.cols.forEach(x=>{
    edges+=`<path class="edge dash" d="M${x} 226V170"/>`;
    nodes+=`<g aria-hidden="true"><circle cx="${x}" cy="152" r="14" fill="none" stroke="var(--line)" stroke-width="2.5" stroke-dasharray="3 4"/><text class="tq" x="${x}" y="158">?</text></g>`;
  });
  nodes+=`<text class="tq" x="200" y="108" style="font-size:13px">${esc(T('more'))}</text>`;
  list.forEach(n=>{
    const st=status(n);
    const ring=st==='open'?`<circle class="ring" r="${n.r+4}"/>`:'';
    const badge=st==='done'?`<circle class="badge" cx="${n.r*.72}" cy="${-n.r*.72}" r="9"/><path d="M${n.r*.72-4} ${-n.r*.72}l3 3 5-6" fill="none" stroke="var(--on-fuel)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`:'';
    nodes+=`<g class="nd ${st}" data-id="${n.id}" role="button" tabindex="0" ${st==='locked'?'aria-disabled="true"':''} aria-label="${esc(L(n.lab))}" transform="translate(${n.pos[0]} ${n.pos[1]})">${ring}<circle class="c" r="${n.r}"/>${icon(n.icon,0,0,n.r)}${badge}<text y="${n.r+16}">${esc(L(n.lab))}</text></g>`;
  });
  stage.innerHTML=`<button type="button" class="back" data-act="world">← ${T('tabWorld')}</button>
   <p class="kicker">${T('concept')}</p>
   <h1 class="h1">${esc(L(F.lab))}</h1>
   <p class="muted">${T('forestSub')}</p>
   <div class="meta"><span class="pill">${d}/${t} ${T('found')}</span>${levelPill()}</div>
   <svg class="tree" viewBox="0 0 400 700" role="group" aria-label="${esc(L(F.lab))}">${edges}${nodes}</svg>`;
}
function treeTap(id){
  const n=NODES[id],st=status(n);
  if(st==='root')openSheet(L(n.lab),T('rootText'));
  else if(st==='locked')toast(T('lockedText')+' '+L(NODES[n.parent].lab));
  else if(st==='soon')openSheet(L(n.soonQ),T('soonTitle')+'. '+T('soonText'));
  else startNode(id);
}

/* base */
function scene(ft){
  const beam=40+ft*38,op=(.1+ft*.1).toFixed(2),halo=14+ft*9;
  const built=PLAY.filter(n=>S.done[n.id]);
  const spots=[[40,206,1],[78,206,1],[116,206,1],[152,208,1],[250,208,1],[288,206,1],[326,206,1],[362,204,1],[60,216,.8],[134,218,.8],[270,218,.8],[344,216,.8],[96,198,.7],[308,198,.7]];
  const shape=(i,x,y,c,s)=>{
    const k=i%3;
    const g=k===0?`<rect x="${x-11}" y="${y-16}" width="22" height="16" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"/><polygon points="${x-14},${y-16} ${x},${y-30} ${x+14},${y-16}" fill="${c}"/>`
     :k===1?`<rect x="${x-6}" y="${y-34}" width="12" height="34" rx="2" fill="${c}" stroke="var(--ink2)" stroke-width="2"/><rect x="${x-3}" y="${y-26}" width="6" height="6" fill="var(--surface)"/>`
     :`<path d="M${x-14} ${y}a14 14 0 0 1 28 0z" fill="${c}" stroke="var(--ink2)" stroke-width="2"/><rect x="${x-3}" y="${y-8}" width="6" height="8" fill="var(--surface)"/>`;
    return `<g transform="translate(${x} ${y}) scale(${s}) translate(${-x} ${-y})">${g}</g>`;};
  return `<svg class="scene" viewBox="0 0 400 280" role="img" aria-label="${esc(T('baseTitle'))}">
   <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient></defs>
   <rect width="400" height="280" fill="url(#sky)"/>
   <rect y="212" width="400" height="68" fill="var(--ice)" opacity=".45"/>
   <path d="M0 246q25-8 50 0t50 0 50 0 50 0 50 0 50 0 50 0 50 0" fill="none" stroke="var(--ice)" stroke-width="2" opacity=".8"/>
   <ellipse cx="200" cy="208" rx="176" ry="26" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
   <polygon points="200,134 ${200-beam},116 ${200-beam},156" fill="var(--fuel)" opacity="${op}"/>
   <polygon points="200,134 ${200+beam},116 ${200+beam},156" fill="var(--fuel)" opacity="${op}"/>
   <circle cx="200" cy="134" r="${halo}" fill="var(--fuel)" opacity=".28"/>
   <polygon points="190,202 210,202 206,148 194,148" fill="var(--surface2)" stroke="var(--ink2)" stroke-width="2"/>
   <polygon points="192,186 208,186 207,176 193,176" fill="var(--bad)"/>
   <rect x="193" y="134" width="14" height="14" fill="var(--fuel)" stroke="var(--ink2)" stroke-width="2"/>
   <polygon points="190,134 200,121 210,134" fill="var(--ink2)"/>
   ${built.slice(0,spots.length).map((n,i)=>{const sp=spots[i];return shape(i,sp[0],sp[1],`var(${FCOL[(FORESTS[n.fid].ci)%FCOL.length]})`,sp[2]);}).join('')}
  </svg>`;
}
function base(){
  const ft=fuelTier(),nextAt=FUEL[ft+1];
  const pct=nextAt?Math.round((S.energy-FUEL[ft])/(nextAt-FUEL[ft])*100):100;
  const built=PLAY.filter(n=>S.done[n.id]);
  stage.innerHTML=`<p class="kicker">${T('lighthouse')}</p>
   <h1 class="h1">${T('baseTitle')}</h1>
   <p class="muted">${T('baseSub')}</p>
   <div class="meta"><span class="pill fuel">${nf(S.energy)} ${T('gainTxt')}</span><span class="pill">${esc(T('tiers')[ft])}</span>${levelPill()}</div>
   ${scene(ft)}
   ${rwShelf()}
   <div class="card" style="display:grid;gap:8px"><div class="small">${nextAt?T('nextTier')+': '+nf(nextAt-S.energy)+' '+T('gainTxt'):T('maxTier')}</div>
    <div class="bar2" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div></div>
   <div class="card" style="display:grid;gap:8px"><b>${T('builtTitle')} (${built.length}/${PLAY.length})</b>
    ${built.length?`<div class="tags">${built.map(n=>`<span>${esc(L(n.item))}</span>`).join('')}</div>`:`<p class="muted">${T('noBuilt')}</p>`}</div>`;
}

/* node flow */
function startNode(id){curF=NODES[id].fid;run={id,step:0,pick:null,layers:1,tier:1,chPick:null,touched:false};view='node';render();window.scrollTo(0,0);}
const stepper=()=>`<div class="steps" aria-hidden="true">${['s0','s1','s2','s3','s4'].map((k,i)=>`<span class="${i<run.step?'done':i===run.step?'on':''}">${T(k)}</span>`).join('')}</div>`;

function nodeView(){
  const n=NODES[run.id],lab=esc(L(n.lab));
  let b='';
  if(run.step===0){
    b=`<p class="kicker">${lab} · ${T('s0')}</p><h1 class="q">${esc(L(n.q))}</h1><p class="muted">${T('guess')}</p>
     <div class="opts">${L(n.o).map((o,i)=>`<button type="button" class="opt${run.pick===i?' picked':''}" data-act="guess" data-i="${i}" ${run.pick!=null?'disabled':''}>${esc(o)}</button>`).join('')}</div>
     ${run.pick!=null?`<p class="small">${T('picked')}</p><div class="actions"><button type="button" class="btn" data-act="toLab">${T('tryIt')}</button></div>`:''}`;
  }else if(run.step===1){
    b=`<p class="kicker">${lab} · ${T('s1')}</p><h1 class="q">${esc(L(n.q))}</h1><p class="muted">${esc(L(n.tip))}</p><div id="lab"></div>
     <div class="actions"><button type="button" class="btn" data-act="toWhy">${T('seen')}</button></div>`;
  }else if(run.step===2){
    const ok=run.pick===n.a,next=n.layers[run.layers];
    b=`<p class="kicker">${lab} · ${T('s2')}</p>
     <div class="why"><b>${T('yourGuess')}:</b> ${esc(L(n.o)[run.pick])} ${ok?'✓':''}<br><b>${T('answerIs')}:</b> ${esc(L(n.o)[n.a])}</div>
     ${n.layers.slice(0,run.layers).map((l,i)=>`<div class="layer"><span class="lchip">${S.lang==='tr'?'Kat':'Layer'} ${i+1}</span><h3>${i===0?(S.lang==='tr'?'Ne gördük?':'What did we see?'):esc(L(l.ask))}</h3><p>${esc(L(l.t))}</p></div>`).join('')}
     <div class="actions">${next?`<button type="button" class="btn" data-act="more">${esc(L(next.ask))}</button>`:''}<button type="button" class="btn${next?' ghost':''}" data-act="toCh">${T('toChallenge')}</button></div>`;
  }else if(run.step===3){
    const c=n.ch[run.tier-1],did=run.chPick!=null,ok=run.chPick===c.a;
    b=`<p class="kicker">${lab} · ${T('challenge')}</p><div class="meta">${levelPill()}</div><h1 class="q">${esc(L(c.q))}</h1>
     <div class="opts">${L(c.o).map((o,i)=>{const cls=did?(i===c.a?' right':(i===run.chPick?' wrong':'')):'';return `<button type="button" class="opt${cls}" data-act="chpick" data-i="${i}" ${did?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>
     ${did?`<div class="why"><b>${ok?T('correct'):T('notYet')}</b> ${esc(L(c.why))}</div><div class="actions"><button type="button" class="btn" data-act="toReward">${T('next')}</button></div>`:`<p class="small">${T('adapt')}</p>`}`;
  }else{
    const kids=NODE_LIST.filter(k=>k.parent===n.id);
    b=`<p class="kicker">${T('s4')}</p><h1 class="h1">${lab} ✓</h1>
     <div class="card"><b>${T('built')}</b><br>${esc(L(n.item))}</div>
     ${kids.length?`<div class="card"><b>${T('newBranches')}</b><br>${kids.map(k=>esc(L(k.lab))).join(' · ')}</div>`:''}
     <div class="card" style="display:grid;gap:8px">${rwBar()}</div>
     <div class="meta"><span class="pill fuel">${nf(S.energy)} ${T('gainTxt')}</span>${levelPill()}</div>
     <div class="actions"><button type="button" class="btn" data-act="home">${T('backToForest')}</button><button type="button" class="btn ghost" data-act="toBase">${T('toBase')}</button></div>`;
  }
  stage.innerHTML=`<button type="button" class="back" data-act="home">← ${esc(L(FORESTS[n.fid].lab))}</button>${stepper()}${b}`;
  if(run.step===1){
    const touch=()=>{if(!run.touched){run.touched=true;gain(n.id+':exp',5);}};
    labStop=n.exp?LABS[n.exp]($('#lab'),touch):GEN(n.gen,$('#lab'),touch);
  }
}

function act(a,i){
  const n=run&&NODES[run.id];
  if(a==='home'){setView('forest');}
  else if(a==='world'){setView('world');}
  else if(a==='toBase'){setView('base');}
  else if(a==='guess'){if(run.pick!=null)return;run.pick=i;gain(n.id+':guess',5);render();}
  else if(a==='toLab'){run.step=1;render();window.scrollTo(0,0);}
  else if(a==='toWhy'){run.step=2;render();window.scrollTo(0,0);}
  else if(a==='more'){
    if(run.layers<n.layers.length){run.layers++;gain(n.id+':l'+run.layers,10);render();
      const ls=$$('.layer');if(ls.length)ls[ls.length-1].scrollIntoView({block:'center',behavior:'smooth'});}
  }
  else if(a==='toCh'){run.step=3;run.tier=tier();run.chPick=null;render();window.scrollTo(0,0);}
  else if(a==='chpick'){
    if(run.chPick!=null)return;
    const c=n.ch[run.tier-1],ok=i===c.a;run.chPick=i;
    S.skill=ok?Math.min(3,S.skill+.6):Math.max(1,S.skill-.5);save();
    gain(n.id+':ch',ok?20:5);render();
  }
  else if(a==='wear'){const r=RW[i];S.wear=(S.wear===r.p?null:r.p);save();render();toast(S.wear?r.e+' '+L(r.n):'–');}
  else if(a==='rwlock'){const r=RW[i];toast('🔒 '+nf(r.p-S.energy)+' '+T('gainTxt'));}
  else if(a==='toReward'){run.step=4;S.done[n.id]=true;save();gain(n.id+':done',10);render();window.scrollTo(0,0);}
}

/* events */
stage.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-id],[data-f]');if(!b||!stage.contains(b))return;
  if(b.dataset.f){curF=b.dataset.f;setView('forest');}
  else if(b.dataset.id)treeTap(b.dataset.id);
  else act(b.dataset.act,+b.dataset.i);
});
stage.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const g=e.target.closest&&e.target.closest('[data-id]');
  if(g&&stage.contains(g)){e.preventDefault();treeTap(g.dataset.id);}
});
$$('[data-lang]').forEach(b=>b.addEventListener('click',()=>{S.lang=b.dataset.lang;save();document.documentElement.lang=S.lang;render();}));
$('#tab-forest').addEventListener('click',()=>setView('world'));
$('#tab-base').addEventListener('click',()=>setView('base'));
function openSheet(t,p){$('#sheet-t').textContent=t;$('#sheet-p').textContent=p;$('#sheet-x').textContent=T('close');$('#sheet').hidden=false;$('#sheet-x').focus();}
$('#sheet-x').addEventListener('click',()=>{$('#sheet').hidden=true;});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')$('#sheet').hidden=true;});

document.documentElement.lang=S.lang;
render();
})();
</script>
